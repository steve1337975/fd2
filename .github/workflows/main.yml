name: VPN Checker

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

  push:
    paths:
      - "README.md"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: vpn-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python main.py

      - name: Commit TXT results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/
          if ! git diff --cached --quiet; then
            git commit -m "Update VPN server lists"
            git push
          fi